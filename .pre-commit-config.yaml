# Runs before every commit. Install once with `make install`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Fixtures are verbatim excerpts of EUR-Lex HTML and must stay byte-identical
      - id: trailing-whitespace
        exclude: ^tests/fixtures/
      - id: end-of-file-fixer
        exclude: ^tests/fixtures/
      - id: check-yaml
      - id: check-toml
      # data/processed holds the parsed corpus, up to about 700 KB per file
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  # ruff runs through uv so it uses exactly the version pinned in uv.lock
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
