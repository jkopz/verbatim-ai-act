name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel older runs of the same branch when a new commit arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow can only read the repo
permissions:
  contents: read

jobs:
  check:
    name: lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --locked fails if uv.lock does not match pyproject.toml
      - name: Install dependencies
        run: uv sync --locked

      - name: Run lint, type check and tests
        run: make test
